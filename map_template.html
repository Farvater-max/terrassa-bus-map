<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="dark">
    <title>Autobuses de Terrassa según el horario</title>
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header>
      <h1 data-i18n="app.title"></h1>
      <label>
        <span data-i18n="control.date"></span>
        <input id="date" type="date">
      </label>
      <label>
        <span data-i18n="control.speed"></span>
        <select id="speed">
          <option value="1">1×</option>
          <option value="10">10×</option>
          <option value="60">60×</option>
          <option value="300">300×</option>
        </select>
      </label>
      <label>
        <span data-i18n="control.schedule"></span>
        <select id="set"></select>
      </label>
      <label>
        <span data-i18n="control.mapStyle"></span>
        <select id="style">
          <option value="dark-gray" data-i18n="map.dark"></option>
          <option value="light-gray" data-i18n="map.light"></option>
        </select>
      </label>
      <label>
        <span data-i18n="control.language"></span>
        <select id="language">
          <option value="es">Español</option>
          <option value="ca">Català</option>
        </select>
      </label>
    </header>

    <div id="bar">
      <button id="play" class="primary" data-i18n="control.pause"></button>
      <button id="now" data-i18n="control.now"></button>
      <span id="clock" aria-live="off">--:--:--</span>
      <input id="slider" type="range" min="0" max="86399" step="60" value="0" data-i18n-aria="control.timeOfDay">
    </div>
    <div id="info" aria-live="polite" data-i18n="status.loading"></div>
    <div id="chips" data-i18n-aria="control.routes"></div>

    <main id="wrap">
      <div id="map" data-i18n-aria="map.aria"></div>
      <canvas id="cv" aria-hidden="true"></canvas>
      <div id="pop" hidden></div>
      <div id="zoom">
        <button id="zi" data-i18n-aria="control.zoomIn">+</button>
        <button id="zo" data-i18n-aria="control.zoomOut">−</button>
      </div>
      <div id="warn" role="status" hidden></div>
      <div id="attr"></div>
    </main>

    <script>
      window.SUPABASE_URL = __SUPABASE_URL__;
      window.SUPABASE_ANON_KEY = __SUPABASE_ANON_KEY__;
      window.TRANSLATIONS = __TRANSLATIONS__;
    </script>
    <script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
    <script type="module" src="./app.js"></script>
  </body>
</html>
